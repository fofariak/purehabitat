# Netlify configuration for PureHabitat (Next.js 16 App Router)
# The official Next.js runtime handles SSR, server actions and static assets.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  # Next.js 16 requires Node 20.9+. Pin a modern LTS for reproducible builds.
  NODE_VERSION = "20"
  # Avoid failing the build on peer-dep warnings.
  NPM_FLAGS = "--no-audit --no-fund"

[[plugins]]
  package = "@netlify/plugin-nextjs"
