<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!--
    Favicon / tab icon — the full outline brandmark in green on navy.
    Strokes are heavier than the header logo (2.8 vs 1.6): at the 16px Chrome
    renders a tab icon at, the header weight disappears entirely.
  -->
  <rect width="48" height="48" rx="10" fill="#16224d"/>
  <g transform="translate(24 24) scale(0.84) translate(-24 -24)"
     stroke="#5ec08f"
     stroke-width="2.8"
     fill="none"
     stroke-linecap="round"
     stroke-linejoin="round">
    <circle cx="24" cy="24" r="20.5"/>
    <!-- Upper leaf (fresh air) -->
    <path d="M24 5C15.2 13 15.2 26 24 32.5C32.8 26 32.8 13 24 5Z"/>
    <!-- Lower loop (constant purification) -->
    <path d="M24 20.5C14.3 27.5 14.3 40 24 44.5C33.7 40 33.7 27.5 24 20.5Z"/>
    <!-- Centre vein -->
    <path d="M24 5V44.5"/>
  </g>
</svg>
